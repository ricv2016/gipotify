<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Tu música en tu celular, sin internet.">
  <title>Gipotify</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header id="top"></header>
  <main id="main"></main>
  <div id="dock"></div>
  <div id="player-root"></div>
  <div id="layers"></div>
  <div id="progress" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="pick-files" multiple hidden accept=".mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,audio/*">
  <input type="file" id="pick-folder" multiple hidden webkitdirectory>
  <noscript>Gipotify necesita JavaScript.</noscript>
</body>
</html>
